name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    env:
      ACR_NAME: datapipelinerobtfacr
      REGISTRY: datapipelinerobtfacr.azurecr.io
      IMAGE_NAME: data-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${IMAGE_TAG} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            .

      - name: Push Docker images
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${IMAGE_TAG}
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Update Container App Job
        run: |
          az containerapp job update \
            --name data-pipeline-job-tf \
            --resource-group data-pipeline-rg-tf \
            --image datapipelinerobtfacr.azurecr.io/data-pipeline:${IMAGE_TAG}
